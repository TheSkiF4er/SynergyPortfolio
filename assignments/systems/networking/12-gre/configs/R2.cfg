hostname R2
no ip domain-lookup
!
interface GigabitEthernet2/0
 description UNDERLAY_TO_R1
 ip address 192.168.12.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet1/0
 description UNDERLAY_TO_R3
 ip address 192.168.23.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet3/0
 description UNDERLAY_TO_R4
 ip address 192.168.24.2 255.255.255.0
 no shutdown
!
! R2 is an underlay transit router only; GRE terminates on R1/R3/R4.
end
