hostname R3
no ip domain-lookup
!
interface GigabitEthernet3/0
 description UNDERLAY_TO_R2
 ip address 192.168.23.3 255.255.255.0
 no shutdown
!
ip route 192.168.12.0 255.255.255.0 192.168.23.2
ip route 192.168.24.0 255.255.255.0 192.168.23.2
!
interface Loopback0
 description OVERLAY_TEST_PREFIX
 ip address 3.3.3.3 255.255.255.255
!
interface Tunnel13
 description GRE_R3_R1
 ip address 192.168.13.3 255.255.255.0
 ip ospf network point-to-point
 ip ospf cost 10
 tunnel source GigabitEthernet3/0
 tunnel destination 192.168.12.1
 no shutdown
!
interface Tunnel34
 description GRE_R3_R4
 ip address 192.168.34.3 255.255.255.0
 ip ospf network point-to-point
 ip ospf cost 20
 tunnel source GigabitEthernet3/0
 tunnel destination 192.168.24.4
 no shutdown
!
router ospf 1
 router-id 3.3.3.3
 passive-interface default
 no passive-interface Tunnel13
 no passive-interface Tunnel34
 network 3.3.3.3 0.0.0.0 area 0
 network 192.168.13.0 0.0.0.255 area 0
 network 192.168.34.0 0.0.0.255 area 0
end
