<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F7F9F7"/><g font-family="Arial"><text x="180" y="110" font-size="22" font-weight="700" fill="#173B2E">CHANGEBODY</text><text x="180" y="220" font-size="46" font-weight="700" fill="#101814">Подберите тренировку</text><text x="180" y="272" font-size="46" font-weight="700" fill="#101814">на сегодня</text><text x="180" y="318" font-size="20" fill="#58645E">Три коротких вопроса — и мы предложим подходящую нагрузку.</text><text x="180" y="385" font-size="18" font-weight="700">Сколько времени у вас есть?</text><g fill="#FFF" stroke="#BCC8C0" stroke-width="2"><rect x="180" y="410" width="170" height="58" rx="14"/><rect x="370" y="410" width="170" height="58" rx="14"/><rect x="560" y="410" width="170" height="58" rx="14"/></g><g font-size="18"><text x="232" y="447">10 минут</text><text x="422" y="447">20 минут</text><text x="612" y="447">30 минут</text></g><text x="180" y="540" font-size="18" font-weight="700">Есть ограничения по нагрузке?</text><rect x="180" y="564" width="550" height="62" rx="14" fill="#FFF" stroke="#C94747" stroke-width="2"/><text x="205" y="602" font-size="18" fill="#A6AAA8">Например: колено, поясница</text><text x="180" y="658" font-size="16" fill="#B12F2F">Опишите ограничение или выберите «Нет ограничений».</text><rect x="180" y="715" width="285" height="66" rx="16" fill="#173B2E"/><text x="222" y="757" font-size="20" font-weight="700" fill="white">Подобрать тренировку</text><rect x="980" y="210" width="650" height="560" rx="28" fill="#E5EFE8"/><text x="1040" y="285" font-size="17" font-weight="700" fill="#173B2E">SUCCESS STATE</text><text x="1040" y="385" font-size="36" font-weight="700">Готово. План сохранён.</text><text x="1040" y="415" font-size="19" fill="#526059">Первая тренировка займёт 12 минут.</text><rect x="1040" y="475" width="270" height="64" rx="16" fill="#173B2E"/><text x="1087" y="516" font-size="20" font-weight="700" fill="white">Начать тренировку</text><text x="180" y="970" font-size="16" fill="#65716B">Принцип: коротко · конкретно · без обвинения пользователя · следующий шаг очевиден</text></g></svg>