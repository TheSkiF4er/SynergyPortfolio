<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FCFCFB"/><text x="100" y="90" font-family="Arial" font-size="40" font-weight="700">Типографическая система</text><g transform="translate(100 150)"><rect width="520" height="300" rx="24" fill="#F2F5F2"/><text x="32" y="48" font-family="Arial" font-size="18" font-weight="700">ПАРА A · Arial + Georgia</text><text x="32" y="118" font-family="Georgia" font-size="42" font-weight="700">Движение без спешки</text><text x="32" y="170" font-family="Arial" font-size="19">Нейтральный интерфейс, редакционный акцент.</text><text x="32" y="230" font-family="Arial" font-size="16" fill="#59645F">Плюс: контраст ролей · Минус: смешанная пластика</text></g><g transform="translate(700 150)"><rect width="520" height="300" rx="24" fill="#F2F5F2"/><text x="32" y="48" font-family="Arial" font-size="18" font-weight="700">ПАРА B · Trebuchet + Georgia</text><text x="32" y="118" font-family="Georgia" font-size="42" font-weight="700">Движение без спешки</text><text x="32" y="170" font-family="Trebuchet MS" font-size="19">Мягче и дружелюбнее для lifestyle-сервиса.</text><text x="32" y="230" font-family="Arial" font-size="16" fill="#59645F">Плюс: характер · Минус: хуже плотные UI-сценарии</text></g><g transform="translate(1300 150)"><rect width="520" height="300" rx="24" fill="#E2EFE6" stroke="#173B2E" stroke-width="3"/><text x="32" y="48" font-family="Arial" font-size="18" font-weight="700" fill="#173B2E">ПАРА C · Arial — ВЫБРАНО</text><text x="32" y="118" font-family="Arial" font-size="42" font-weight="700">Движение без спешки</text><text x="32" y="170" font-family="Arial" font-size="19">Максимальная предсказуемость и читаемость.</text><text x="32" y="230" font-family="Arial" font-size="16" fill="#59645F">Плюс: accessibility · стабильность · UI density</text></g><g font-family="Arial" transform="translate(100 540)"><text y="0" font-size="18" font-weight="700" fill="#173B2E">FINAL SCALE</text><text y="85" font-size="52" font-weight="700">Display 52 / 60</text><text y="155" font-size="40" font-weight="700">H1 40 / 48</text><text y="218" font-size="28" font-weight="700">H2 28 / 36</text><text y="273" font-size="20" font-weight="600">Subheader 20 / 28 — важный поясняющий текст</text><text y="330" font-size="18">Body 18 / 28 — основной текст интерфейса и инструкций.</text><text y="375" font-size="14" fill="#65716B">Caption 14 / 20 — только вторичная метаинформация.</text></g></svg>