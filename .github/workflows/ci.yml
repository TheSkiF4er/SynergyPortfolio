name: Portfolio checks

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and smoke-test OS assignments
        run: make -C CA-OS test
      - name: Test JavaScript assignments
        run: node --test CA-JS/tests/solutions.test.mjs
      - name: Install Python test runner
        run: python -m pip install pytest
      - name: Test CS1 PLUS
        run: python -m pytest -q CS1PLUS/tests
      - name: Test CS1 MAX
        run: python -m pytest -q CS1MAX/tests
      - name: Compile Python sources
        run: python -m compileall -q CA-ARCH CS1PLUS CS1MAX

  architecture-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript compiler
        run: npm install --global typescript@5.8.3
      - name: Compile and test patterns
        run: npm --prefix CA-ARCH/patterns test
