<!doctype html><meta charset="utf-8"><title>OOP</title><pre>Откройте DevTools Console</pre><script>class Employee{constructor(firstName,lastName,rate,days){this.firstName=firstName;this.lastName=lastName;this.rate=rate;this.days=days}salary(){return this.rate*this.days}}class Employee1{#firstName;#lastName;#rate;#days;constructor(firstName,lastName,rate,days){this.#firstName=firstName;this.#lastName=lastName;this.#rate=rate;this.#days=days}getFirstName(){return this.#firstName}setFirstName(v){this.#firstName=v}getLastName(){return this.#lastName}setLastName(v){this.#lastName=v}getRate(){return this.#rate}setRate(v){this.#rate=v}getDays(){return this.#days}setDays(v){this.#days=v}salary(){if(!Number.isFinite(this.#rate)||!Number.isFinite(this.#days)){console.error('Недостаточно данных для расчёта зарплаты');return null}return this.#rate*this.#days}}const a=new Employee('Иван','Иванов',5000,20);console.log(a,a.salary());const b=new Employee1('Пётр','Петров',4500,21);console.log(b.getFirstName(),b.getLastName(),b.getRate(),b.getDays(),b.salary());</script>
