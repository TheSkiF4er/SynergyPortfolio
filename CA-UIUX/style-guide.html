<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHANGEBODY UI Study</title><style>:root{--bg:#f4f7f6;--surface:#fff;--text:#15201c;--muted:#66736e;--primary:#157a55;--r:18px}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,system-ui;background:var(--bg);color:var(--text)}main{max-width:1100px;margin:auto;padding:48px 24px}h1{font-size:48px;line-height:1.15}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{background:var(--surface);border-radius:var(--r);padding:24px;border:1px solid #dfe7e3}.btn{display:inline-block;background:var(--primary);color:white;padding:12px 18px;border-radius:12px}.sw{height:90px;border-radius:12px}.blue{background:#2459d3}.coral{background:#db604c}.green{background:#157a55}@media(max-width:700px){h1{font-size:36px}.grid{grid-template-columns:1fr}}</style><main><p>CA-UIUX / visual study</p><h1>CHANGEBODY design system</h1><p>Композиция, типографика, цвета, responsive grid и базовые компоненты.</p><h2>Color alternatives</h2><div class="grid"><div class="card"><div class="sw blue"></div><h3>Calm blue</h3></div><div class="card"><div class="sw coral"></div><h3>Warm coral</h3></div><div class="card"><div class="sw green"></div><h3>Accessible green</h3></div></div><h2>Components</h2><div class="card"><h3>Тренировка на сегодня</h3><p>20 минут · низкая нагрузка</p><span class="btn">Начать тренировку</span></div></main></html>
