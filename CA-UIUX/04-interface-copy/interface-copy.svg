<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#F5F7FA"/>
<text x="80" y="90" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#111827">Текст в интерфейсе</text>
<text x="80" y="132" font-family="Arial,sans-serif" font-size="20" fill="#667085">Короткие действия, ясные ошибки, полезные подсказки</text>
<rect x="90" y="190" width="390" height="220" rx="20" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="118" y="235" font-family="Arial" font-size="22" font-weight="700" fill="#101828">CTA</text>
<text x="118" y="270" font-family="Arial" font-size="16" fill="#475467">«Продолжить», а не «ОК»</text><rect x="525" y="190" width="390" height="220" rx="20" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="553" y="235" font-family="Arial" font-size="22" font-weight="700" fill="#101828">Ошибка</text>
<text x="553" y="270" font-family="Arial" font-size="16" fill="#475467">«Введите email в формате name@example.com»</text><rect x="960" y="190" width="390" height="220" rx="20" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="988" y="235" font-family="Arial" font-size="22" font-weight="700" fill="#101828">Empty state</text>
<text x="988" y="270" font-family="Arial" font-size="16" fill="#475467">«Здесь пока нет проектов. Создайте первый.»</text><rect x="90" y="490" width="1260" height="220" rx="22" fill="#FFFFFF" stroke="#D0D5DD"/><text x="125" y="550" font-family="Arial" font-size="22" font-weight="700" fill="#101828">Пример формы</text><rect x="125" y="590" width="600" height="64" rx="10" fill="#fff" stroke="#98A2B3"/><text x="150" y="630" font-family="Arial" font-size="17" fill="#667085">name@example.com</text><rect x="755" y="590" width="230" height="64" rx="10" fill="#2563EB"/><text x="807" y="630" font-family="Arial" font-size="18" fill="#fff">Продолжить</text>
</svg>