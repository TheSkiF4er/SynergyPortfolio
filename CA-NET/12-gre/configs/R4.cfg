hostname R4
no ip domain-lookup
!
interface GigabitEthernet3/0
 description UNDERLAY_TO_R2
 ip address 192.168.24.4 255.255.255.0
 no shutdown
!
ip route 192.168.12.0 255.255.255.0 192.168.24.2
ip route 192.168.23.0 255.255.255.0 192.168.24.2
!
interface Loopback0
 description OVERLAY_TEST_PREFIX
 ip address 4.4.4.4 255.255.255.255
!
interface Tunnel34
 description GRE_R4_R3
 ip address 192.168.34.4 255.255.255.0
 ip ospf network point-to-point
 ip ospf cost 20
 tunnel source GigabitEthernet3/0
 tunnel destination 192.168.23.3
 no shutdown
!
interface Tunnel14
 description GRE_R4_R1
 ip address 192.168.14.4 255.255.255.0
 ip ospf network point-to-point
 ip ospf cost 30
 tunnel source GigabitEthernet3/0
 tunnel destination 192.168.12.1
 no shutdown
!
router ospf 1
 router-id 4.4.4.4
 passive-interface default
 no passive-interface Tunnel34
 no passive-interface Tunnel14
 network 4.4.4.4 0.0.0.0 area 0
 network 192.168.34.0 0.0.0.255 area 0
 network 192.168.14.0 0.0.0.255 area 0
end
