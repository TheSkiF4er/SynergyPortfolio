hostname R1
no ip domain-lookup
!
interface GigabitEthernet3/0
 description UNDERLAY_TO_R2
 ip address 192.168.12.1 255.255.255.0
 no shutdown
!
! Underlay reachability to GRE destinations. These routes must not depend on GRE.
ip route 192.168.23.0 255.255.255.0 192.168.12.2
ip route 192.168.24.0 255.255.255.0 192.168.12.2
!
interface Loopback0
 description OVERLAY_TEST_PREFIX
 ip address 1.1.1.1 255.255.255.255
!
interface Tunnel13
 description GRE_R1_R3
 ip address 192.168.13.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf cost 10
 tunnel source GigabitEthernet3/0
 tunnel destination 192.168.23.3
 no shutdown
!
interface Tunnel14
 description GRE_R1_R4
 ip address 192.168.14.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf cost 30
 tunnel source GigabitEthernet3/0
 tunnel destination 192.168.24.4
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface Tunnel13
 no passive-interface Tunnel14
 network 1.1.1.1 0.0.0.0 area 0
 network 192.168.13.0 0.0.0.255 area 0
 network 192.168.14.0 0.0.0.255 area 0
end
