hostname R2
no ip domain-lookup
interface GigabitEthernet2/0
 no shutdown
 ip address 192.168.12.2 255.255.255.0
interface GigabitEthernet1/0
 no shutdown
 ip address 192.168.23.2 255.255.255.0
interface GigabitEthernet3/0
 no shutdown
 ip address 192.168.24.2 255.255.255.0
ip access-list extended BLOCK-R1-TELNET-R4
 deny tcp host 192.168.12.1 host 192.168.24.4 eq 23
 permit ip any any
interface GigabitEthernet2/0
 ip access-group BLOCK-R1-TELNET-R4 in
end
